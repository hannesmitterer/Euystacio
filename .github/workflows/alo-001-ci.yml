name: ALO-001 CI

on:
  push:
    branches:
      - 'alo-001/**'
      - 'copilot/alo-001**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: '18'
          install-deps: 'true'
      
      - name: Build TypeScript
        run: npm run build
      
      - name: Verify .env.example exists
        run: |
          if [ ! -f .env.example ]; then
            echo "Error: .env.example file not found!"
            exit 1
          fi
          echo ".env.example file verified ✓"
      
      - name: Verify .env.example contains required variables
        run: |
          required_vars=("GOOGLE_CLIENT_ID" "COUNCIL_ALLOWLIST" "SEEDBRINGER_ALLOWLIST")
          for var in "${required_vars[@]}"; do
            if ! grep -q "$var" .env.example; then
              echo "Error: $var not found in .env.example"
              exit 1
            fi
          done
          echo "All required environment variables present in .env.example ✓"
      
      - name: Check build artifacts
        run: |
          if [ ! -d dist ]; then
            echo "Error: dist directory not created!"
            exit 1
          fi
          echo "Build artifacts verified ✓"
      
      - name: Run security audit
        run: npm audit --audit-level=high || echo "Security audit completed with warnings"
        continue-on-error: true
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: alo-001-build
          path: dist/
          retention-days: 7
