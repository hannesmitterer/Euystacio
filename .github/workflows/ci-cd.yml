name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Run daily at 02:00 UTC for scheduled dependency checks
    - cron: '0 2 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        uses: nick-fields/retry-action@v3
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 10
          command: npm ci
      
      - name: Lint TypeScript
        run: |
          npm install --save-dev eslint @typescript-eslint/parser @typescript-eslint/eslint-plugin
          npx eslint src --ext .ts --max-warnings 0 || echo "No critical linting errors"
        continue-on-error: true
      
      - name: Build TypeScript
        uses: nick-fields/retry-action@v3
        with:
          timeout_minutes: 5
          max_attempts: 2
          retry_wait_seconds: 5
          command: npm run build
      
      - name: Verify build artifacts
        run: |
          if [ ! -d dist ]; then
            echo "Error: dist directory not created!"
            exit 1
          fi
          echo "Build artifacts verified ✓"
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip'
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
      
      - name: Lint Python code
        run: |
          pip install flake8
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
        continue-on-error: true
      
      - name: Run unit tests (if available)
        run: |
          if [ -f "package.json" ] && grep -q '"test"' package.json; then
            npm test || echo "Unit tests failed or not configured"
          else
            echo "No unit tests configured"
          fi
        continue-on-error: true
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: dist/
          retention-days: 7
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test-results/
            coverage/
          retention-days: 14
        continue-on-error: true

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        uses: nick-fields/retry-action@v3
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 10
          command: npm ci
      
      - name: Run npm audit
        run: |
          npm audit --audit-level=moderate > audit-results.txt 2>&1 || true
          cat audit-results.txt
          echo "Security audit completed"
        continue-on-error: true
      
      - name: Upload audit results
        uses: actions/upload-artifact@v4
        with:
          name: security-audit-results
          path: audit-results.txt
          retention-days: 30
        continue-on-error: true
      
      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        if: github.event_name == 'pull_request'
        continue-on-error: true

  build-verification:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: [lint-and-test]
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        uses: nick-fields/retry-action@v3
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 10
          command: npm ci
      
      - name: Build project
        uses: nick-fields/retry-action@v3
        with:
          timeout_minutes: 5
          max_attempts: 2
          retry_wait_seconds: 5
          command: npm run build
      
      - name: Verify environment configuration
        run: |
          if [ ! -f .env.example ]; then
            echo "Warning: .env.example file not found!"
          else
            echo ".env.example file verified ✓"
            required_vars=("GOOGLE_CLIENT_ID" "COUNCIL_ALLOWLIST" "SEEDBRINGER_ALLOWLIST")
            for var in "${required_vars[@]}"; do
              if ! grep -q "$var" .env.example; then
                echo "Warning: $var not found in .env.example"
              else
                echo "$var found ✓"
              fi
            done
          fi
      
      - name: Test Python app imports
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          python -c "import sys; print(f'Python version: {sys.version}')"
          if [ -f app.py ]; then
            python -c "import app; print('app.py imports successfully')" || echo "app.py has import issues"
          fi
        continue-on-error: true

  notify-status:
    name: Workflow Status
    runs-on: ubuntu-latest
    needs: [lint-and-test, security-scan, build-verification]
    if: always()
    permissions:
      contents: read
    
    steps:
      - name: Report workflow status
        run: |
          echo "Workflow completed!"
          echo "Lint & Test: ${{ needs.lint-and-test.result }}"
          echo "Security Scan: ${{ needs.security-scan.result }}"
          echo "Build Verification: ${{ needs.build-verification.result }}"
          
          # Generate workflow report
          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          cat > workflow-report.md << EOF
          # CI/CD Pipeline Report
          
          **Date:** $TIMESTAMP
          **Workflow Run:** \${{ github.run_number }}
          **Trigger:** \${{ github.event_name }}
          
          ## Job Results
          - Lint & Test: \${{ needs.lint-and-test.result }}
          - Security Scan: \${{ needs.security-scan.result }}
          - Build Verification: \${{ needs.build-verification.result }}
          
          ## Repository
          - Branch: \${{ github.ref_name }}
          - Commit: \${{ github.sha }}
          EOF
          
          cat workflow-report.md
      
      - name: Upload workflow report
        uses: actions/upload-artifact@v4
        with:
          name: workflow-report
          path: workflow-report.md
          retention-days: 30
        continue-on-error: true
