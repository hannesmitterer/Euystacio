name: CI Pipeline

on:
  push:
    branches:
      - main
      - 'copilot/**'
      - 'alo-001/**'
  pull_request:
    branches:
      - main

jobs:
  # TypeScript/Node.js Build and Test
  typescript-build:
    name: Build TypeScript Components
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build TypeScript
        run: npm run build
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: typescript-dist
          path: dist/
          retention-days: 7
      
      - name: Verify required files
        run: |
          if [ ! -f .env.example ]; then
            echo "Warning: .env.example file not found"
          fi
          if [ ! -d dist ]; then
            echo "Error: dist directory not created"
            exit 1
          fi
          echo "Build verification passed ✓"

  # Python Build and Test
  python-build:
    name: Build Python Components
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Verify Python files
        run: |
          python -c "import app; print('app.py imports successfully')"
          python -c "import euystacio_core; print('euystacio_core.py imports successfully')"
          echo "Python verification passed ✓"

  # Security Audit
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run npm audit
        run: npm audit --audit-level=moderate
        continue-on-error: true
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      
      - name: Install pip-audit
        run: pip install pip-audit
      
      - name: Run pip audit
        run: pip-audit -r requirements.txt
        continue-on-error: true

  # Build Status
  build-status:
    name: Build Status
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [typescript-build, python-build, security-audit]
    if: always()
    
    steps:
      - name: Check build status
        run: |
          echo "TypeScript Build: ${{ needs.typescript-build.result }}"
          echo "Python Build: ${{ needs.python-build.result }}"
          echo "Security Audit: ${{ needs.security-audit.result }}"
          
          if [ "${{ needs.typescript-build.result }}" != "success" ] || [ "${{ needs.python-build.result }}" != "success" ]; then
            echo "Build failed!"
            exit 1
          fi
          
          echo "All builds successful ✓"
