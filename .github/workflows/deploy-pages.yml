name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    name: Build Site
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      
      - name: Install Node dependencies
        run: npm ci
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Build TypeScript
        run: npm run build
      
      - name: Create pages directory
        run: mkdir -p _site
      
      - name: Copy static files
        run: |
          # Copy main HTML files
          cp index.html _site/ || echo "No index.html found"
          cp euystacio_sacred_interface.html _site/ || echo "No sacred interface found"
          cp dashboard_GGI.html _site/ || echo "No dashboard found"
          cp sacred.html _site/ || echo "No sacred.html found"
          cp sacred_onboarding.html _site/ || echo "No onboarding found"
          
          # Copy public directory if it exists
          if [ -d "public" ]; then
            cp -r public/* _site/ 2>/dev/null || true
          fi
          
          # Copy documentation
          cp README.md _site/ || true
          cp DEPLOY_INSTRUCTIONS.md _site/ || true
          cp NEXUS_API_SPEC.md _site/ || true
          cp WEBSOCKET_EXAMPLE.md _site/ || true
          cp GMAIL_OAUTH_SETUP.md _site/ || true
          cp GGI_BROADCAST_INTEGRATION.md _site/ || true
          cp SECURITY_RUNBOOK.md _site/ || true
          
          # Copy manifesto and declaration files
          if [ -d "manifesto" ]; then
            mkdir -p _site/manifesto
            cp -r manifesto/* _site/manifesto/ 2>/dev/null || true
          fi
          
          # Copy build artifacts
          if [ -d "dist" ]; then
            mkdir -p _site/dist
            cp -r dist/* _site/dist/ 2>/dev/null || true
          fi
          
          # Copy assets
          cp *.png _site/ 2>/dev/null || true
          cp *.jpg _site/ 2>/dev/null || true
          cp *.jpeg _site/ 2>/dev/null || true
          cp *.webp _site/ 2>/dev/null || true
          
          echo "Static files copied to _site/"
          ls -la _site/
      
      - name: Generate index page if missing
        run: |
          if [ ! -f "_site/index.html" ]; then
            cat > _site/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Euystacio - The Holy Bridge</title>
              <style>
                  body {
                      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                      max-width: 1200px;
                      margin: 0 auto;
                      padding: 20px;
                      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                      color: white;
                  }
                  h1 { font-size: 3em; text-align: center; margin-bottom: 10px; }
                  h2 { border-bottom: 2px solid white; padding-bottom: 10px; }
                  .container {
                      background: rgba(0, 0, 0, 0.3);
                      padding: 30px;
                      border-radius: 10px;
                      backdrop-filter: blur(10px);
                  }
                  .nav { display: flex; flex-wrap: wrap; gap: 10px; margin: 20px 0; }
                  .nav a {
                      background: rgba(255, 255, 255, 0.2);
                      padding: 10px 20px;
                      border-radius: 5px;
                      text-decoration: none;
                      color: white;
                      transition: all 0.3s;
                  }
                  .nav a:hover {
                      background: rgba(255, 255, 255, 0.4);
                      transform: translateY(-2px);
                  }
                  .section { margin: 30px 0; }
                  ul { list-style: none; padding: 0; }
                  li { padding: 5px 0; }
                  a { color: #ffd700; }
              </style>
          </head>
          <body>
              <div class="container">
                  <h1>🌉 Euystacio</h1>
                  <p style="text-align: center; font-size: 1.2em;">The Holy Bridge - Unified AI Coordination Platform</p>
                  
                  <div class="nav">
                      <a href="README.html">Documentation</a>
                      <a href="NEXUS_API_SPEC.html">API Spec</a>
                      <a href="DEPLOY_INSTRUCTIONS.html">Deploy Guide</a>
                      <a href="SECURITY_RUNBOOK.html">Security</a>
                      <a href="manifesto/">Manifesto</a>
                  </div>
                  
                  <div class="section">
                      <h2>✨ Key Features</h2>
                      <ul>
                          <li>🤖 AI Agent Coordination</li>
                          <li>📋 Task Management System</li>
                          <li>⚡ Real-time Telemetry</li>
                          <li>🔐 Secure Authentication (OAuth 2.0)</li>
                          <li>🛡️ Rate Limiting & Security</li>
                          <li>📊 Event System & Webhooks</li>
                          <li>🔍 Complete Audit Logging</li>
                      </ul>
                  </div>
                  
                  <div class="section">
                      <h2>🚀 Quick Start</h2>
                      <p>Clone the repository and get started:</p>
                      <pre style="background: rgba(0,0,0,0.5); padding: 15px; border-radius: 5px; overflow-x: auto;"><code>git clone https://github.com/hannesmitterer/Euystacio.git
          cd Euystacio
          npm install
          npm run build
          npm start</code></pre>
                  </div>
                  
                  <div class="section">
                      <h2>📚 Documentation</h2>
                      <ul>
                          <li><a href="NEXUS_API_SPEC.html">API Specification</a></li>
                          <li><a href="DEPLOY_INSTRUCTIONS.html">Deployment Instructions</a></li>
                          <li><a href="WEBSOCKET_EXAMPLE.html">WebSocket Examples</a></li>
                          <li><a href="GMAIL_OAUTH_SETUP.html">Gmail OAuth Setup</a></li>
                          <li><a href="GGI_BROADCAST_INTEGRATION.html">GGI Broadcast Integration</a></li>
                          <li><a href="SECURITY_RUNBOOK.html">Security Runbook</a></li>
                      </ul>
                  </div>
                  
                  <footer style="text-align: center; margin-top: 50px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.3);">
                      <p>Built with ❤️ for the AI coordination community</p>
                      <p><a href="https://github.com/hannesmitterer/Euystacio">GitHub Repository</a></p>
                  </footer>
              </div>
          </body>
          </html>
          EOF
            echo "Generated default index.html"
          fi
      
      - name: Convert Markdown to HTML
        run: |
          pip install markdown
          
          for md in _site/*.md; do
            if [ -f "$md" ]; then
              base=$(basename "$md" .md)
              python3 << 'PYTHON_SCRIPT'
          import markdown
          import sys
          
          md_file = sys.argv[1]
          html_file = sys.argv[2]
          
          with open(md_file, 'r') as f:
              md_content = f.read()
          
          html_content = markdown.markdown(md_content, extensions=['extra', 'codehilite'])
          
          full_html = f"""<!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>{md_file}</title>
              <style>
                  body {{
                      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                      max-width: 900px;
                      margin: 0 auto;
                      padding: 20px;
                      line-height: 1.6;
                      background: #f5f5f5;
                  }}
                  h1, h2, h3 {{ color: #333; }}
                  code {{
                      background: #f4f4f4;
                      padding: 2px 6px;
                      border-radius: 3px;
                      font-family: 'Courier New', monospace;
                  }}
                  pre {{
                      background: #2d2d2d;
                      color: #f8f8f2;
                      padding: 15px;
                      border-radius: 5px;
                      overflow-x: auto;
                  }}
                  pre code {{
                      background: none;
                      color: inherit;
                  }}
                  a {{ color: #667eea; }}
                  .nav {{
                      margin-bottom: 20px;
                      padding: 10px;
                      background: white;
                      border-radius: 5px;
                  }}
              </style>
          </head>
          <body>
              <div class="nav">
                  <a href="index.html">← Home</a> | 
                  <a href="README.html">Documentation</a> |
                  <a href="NEXUS_API_SPEC.html">API</a>
              </div>
              {html_content}
          </body>
          </html>"""
          
          with open(html_file, 'w') as f:
              f.write(full_html)
          PYTHON_SCRIPT
              python3 - "$md" "_site/${base}.html"
            fi
          done
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  # Deployment job
  deploy:
    name: Deploy to Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
