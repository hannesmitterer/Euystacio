name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    name: Build Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Create documentation site
        run: |
          mkdir -p _site
          
          # Copy public directory content
          if [ -d "public" ]; then
            cp -r public/* _site/
          fi
          
          # Copy main HTML files
          if [ -f "index.html" ]; then
            cp index.html _site/
          fi
          
          # Copy documentation files
          cp README.md _site/ || true
          cp DEPLOY_INSTRUCTIONS.md _site/ || true
          cp SECURITY_RUNBOOK.md _site/ || true
          cp NEXUS_API_SPEC.md _site/ || true
          cp WEBSOCKET_EXAMPLE.md _site/ || true
          cp GGI_BROADCAST_INTEGRATION.md _site/ || true
          cp GMAIL_OAUTH_SETUP.md _site/ || true
          
          # Create index for documentation if index.html doesn't exist
          if [ ! -f "_site/index.html" ]; then
            cat > _site/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Euystacio Documentation</title>
            <style>
              body {
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
                max-width: 900px;
                margin: 50px auto;
                padding: 20px;
                line-height: 1.6;
                color: #333;
              }
              h1 { color: #2c3e50; border-bottom: 3px solid #3498db; padding-bottom: 10px; }
              h2 { color: #34495e; margin-top: 30px; }
              ul { list-style-type: none; padding: 0; }
              li { margin: 10px 0; }
              a { color: #3498db; text-decoration: none; padding: 8px 12px; display: inline-block; border-left: 3px solid #3498db; }
              a:hover { background: #ecf0f1; }
              .section { margin: 30px 0; padding: 20px; background: #f8f9fa; border-radius: 5px; }
            </style>
          </head>
          <body>
            <h1>🌌 Euystacio Documentation</h1>
            <p>Welcome to the Euystacio Nexus API - The Holy Bridge for Unified AI Coordination Platform</p>
            
            <div class="section">
              <h2>📚 Core Documentation</h2>
              <ul>
                <li><a href="README.md">README - Getting Started</a></li>
                <li><a href="NEXUS_API_SPEC.md">API Specification</a></li>
                <li><a href="DEPLOY_INSTRUCTIONS.md">Deployment Instructions</a></li>
              </ul>
            </div>
            
            <div class="section">
              <h2>🔧 Integration Guides</h2>
              <ul>
                <li><a href="WEBSOCKET_EXAMPLE.md">WebSocket Examples</a></li>
                <li><a href="GGI_BROADCAST_INTEGRATION.md">GGI Broadcast Integration</a></li>
                <li><a href="GMAIL_OAUTH_SETUP.md">Gmail OAuth Setup</a></li>
              </ul>
            </div>
            
            <div class="section">
              <h2>🛡️ Security</h2>
              <ul>
                <li><a href="SECURITY_RUNBOOK.md">Security Runbook</a></li>
              </ul>
            </div>
            
            <div class="section">
              <h2>📂 Additional Resources</h2>
              <ul>
                <li><a href="manifesto/">Manifesto</a></li>
                <li><a href="pbl-001/">PBL-001</a></li>
              </ul>
            </div>
            
            <footer style="margin-top: 50px; padding-top: 20px; border-top: 1px solid #ddd; text-align: center; color: #666;">
              <p>Built with ❤️ for the AI coordination community</p>
              <p><a href="https://github.com/hannesmitterer/Euystacio">View on GitHub</a></p>
            </footer>
          </body>
          </html>
          EOF
          fi
          
          echo "Documentation site built successfully ✓"
          ls -la _site/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  # Deployment job
  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Deployment Success
        run: |
          echo "✅ Successfully deployed to GitHub Pages"
          echo "URL: ${{ steps.deployment.outputs.page_url }}"
