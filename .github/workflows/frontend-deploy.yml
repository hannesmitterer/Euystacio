name: Frontend Deploy

on:
  push:
    branches: [main, 'deploy/**']
    paths:
      - 'src/**'
      - 'web-prototype/**'
      - 'public/**'
      - 'package.json'
      - 'index.html'
  workflow_dispatch:

# Limit permissions for security
permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci || npm install
      
      - name: Build frontend
        run: npm run build || echo "Build script not configured, skipping"
        env:
          CI: true
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: |
            dist/
            web-prototype/
          retention-days: 7
      
      - name: Validate static files
        run: |
          echo "Validating static frontend files..."
          test -f web-prototype/ave-maria-dashboard.html && echo "✓ Dashboard found" || echo "⚠ Dashboard not found"
          test -f src/App.jsx && echo "✓ App.jsx found" || echo "⚠ App.jsx not found"
          test -f src/components/TamperDemo.jsx && echo "✓ TamperDemo.jsx found" || echo "⚠ TamperDemo.jsx not found"
          echo "Frontend validation complete."
  
