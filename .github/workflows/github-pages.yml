name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build Site
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Pages
        uses: actions/configure-pages@v5
      
      - name: Prepare site content
        run: |
          mkdir -p _site
          
          # Copy main index.html
          cp index.html _site/
          
          # Copy all HTML files (root and docs)
          find . -maxdepth 1 -name "*.html" -type f ! -name "index.html" -exec cp {} _site/ \;
          if [ -d "docs" ]; then
            mkdir -p _site/docs
            find docs -name "*.html" -type f -exec cp {} _site/docs/ \;
          fi
          
          # Copy static assets if they exist
          if [ -d "public" ]; then
            cp -r public/* _site/
          fi
          
          # Copy images and assets (root and subdirectories)
          for ext in png jpg jpeg gif svg webp; do
            find . -name "*.$ext" -type f ! -path "*/node_modules/*" ! -path "*/.git/*" -exec cp --parents {} _site/ \;
          done
          
          # Ensure proper structure
          ls -la _site/
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to Pages
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      
      - name: Report deployment
        run: |
          echo "Deployed to: ${{ steps.deployment.outputs.page_url }}"
          echo "Deployment completed at: $(date)"
