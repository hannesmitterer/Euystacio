name: Code Quality & Linting

on:
  push:
    branches:
      - main
      - 'copilot/**'
  pull_request:
    branches:
      - main

jobs:
  # TypeScript/JavaScript Linting
  eslint:
    name: ESLint
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Install ESLint
        run: npm install --save-dev eslint @typescript-eslint/parser @typescript-eslint/eslint-plugin
      
      - name: Run ESLint
        run: npx eslint src/ --ext .ts,.js
        continue-on-error: true

  # Python Linting
  python-lint:
    name: Python Linting
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      
      - name: Install linting tools
        run: |
          pip install flake8 pylint black
      
      - name: Run Flake8
        run: flake8 *.py --max-line-length=100 --extend-ignore=E203,W503
        continue-on-error: true
      
      - name: Run PyLint
        run: pylint *.py --disable=C0111,R0903,C0103
        continue-on-error: true
      
      - name: Check Black formatting
        run: black --check *.py
        continue-on-error: true

  # Code formatting check
  prettier:
    name: Prettier Format Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install Prettier
        run: npm install --save-dev prettier
      
      - name: Check formatting
        run: npx prettier --check "**/*.{ts,js,json,md,yml,yaml}"
        continue-on-error: true

  # Markdown linting
  markdownlint:
    name: Markdown Linting
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run markdownlint
        uses: articulate/actions-markdownlint@v1
        continue-on-error: true

  lint-status:
    name: Lint Status
    runs-on: ubuntu-latest
    needs: [eslint, python-lint, prettier, markdownlint]
    if: always()
    
    steps:
      - name: Check lint status
        run: |
          echo "ESLint: ${{ needs.eslint.result }}"
          echo "Python Lint: ${{ needs.python-lint.result }}"
          echo "Prettier: ${{ needs.prettier.result }}"
          echo "Markdownlint: ${{ needs.markdownlint.result }}"
          echo "Linting checks completed (non-blocking)"
