name: Release and Deploy

on:
  push:
    tags:
      - 'v*.*.*'
  release:
    types: [published]
  workflow_dispatch:

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build project
        run: npm run build
      
      - name: Generate changelog
        id: changelog
        run: |
          echo "## What's Changed" > changelog.md
          git log --pretty=format:"- %s (%h)" $(git describe --tags --abbrev=0 HEAD^)..HEAD >> changelog.md || echo "- Initial release" >> changelog.md
          cat changelog.md
      
      - name: Create Release Archive
        run: |
          mkdir -p release
          cp -r dist release/
          cp package.json release/
          cp README.md release/
          cp .env.example release/
          tar -czf euystacio-${{ github.ref_name }}.tar.gz -C release .
      
      - name: Upload Release Asset
        if: github.event_name == 'release'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./euystacio-${{ github.ref_name }}.tar.gz
          asset_name: euystacio-${{ github.ref_name }}.tar.gz
          asset_content_type: application/gzip
      
      - name: Deploy notification
        run: |
          echo "✅ Release ${{ github.ref_name }} created successfully"
          echo "Archive: euystacio-${{ github.ref_name }}.tar.gz"
