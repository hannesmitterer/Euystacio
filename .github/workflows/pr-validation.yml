name: PR Validation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  pr-checks:
    name: PR Quality Checks
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check PR title
        run: |
          PR_TITLE="${{ github.event.pull_request.title }}"
          echo "PR Title: $PR_TITLE"
          
          # Check if title follows conventional commit format (optional)
          if [[ ! "$PR_TITLE" =~ ^(feat|fix|docs|style|refactor|test|chore|ci)(\(.+\))?: ]]; then
            echo "⚠️ PR title doesn't follow conventional commit format"
            echo "Consider using: feat|fix|docs|style|refactor|test|chore|ci: description"
          else
            echo "✅ PR title follows conventional commit format"
          fi

      - name: Check PR description
        run: |
          PR_BODY="${{ github.event.pull_request.body }}"
          if [ -z "$PR_BODY" ] || [ ${#PR_BODY} -lt 20 ]; then
            echo "⚠️ PR description is too short or empty"
            echo "Please provide a meaningful description of your changes"
            exit 1
          else
            echo "✅ PR description is adequate"
          fi

      - name: Check for merge conflicts
        run: |
          git fetch origin main
          if git merge-tree $(git merge-base HEAD origin/main) HEAD origin/main | grep -q "<<<<<"; then
            echo "❌ PR has merge conflicts"
            exit 1
          else
            echo "✅ No merge conflicts detected"
          fi

      - name: Check file changes
        run: |
          FILES_CHANGED=$(git diff --name-only origin/main...HEAD | wc -l)
          echo "Files changed: $FILES_CHANGED"
          
          if [ $FILES_CHANGED -gt 50 ]; then
            echo "⚠️ Large PR: $FILES_CHANGED files changed"
            echo "Consider breaking this into smaller PRs"
          else
            echo "✅ Reasonable PR size"
          fi

      - name: Check for sensitive files
        run: |
          SENSITIVE_PATTERNS=(".env" "secrets" "credentials" "private_key" "id_rsa")
          FOUND_SENSITIVE=false
          
          for pattern in "${SENSITIVE_PATTERNS[@]}"; do
            if git diff --name-only origin/main...HEAD | grep -i "$pattern"; then
              echo "⚠️ Warning: Potential sensitive file detected containing '$pattern'"
              FOUND_SENSITIVE=true
            fi
          done
          
          if [ "$FOUND_SENSITIVE" = true ]; then
            echo "Please ensure no secrets are committed!"
          else
            echo "✅ No obvious sensitive files detected"
          fi

      - name: Add PR size label
        uses: actions/github-script@v7
        with:
          script: |
            const files = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            
            const additions = files.data.reduce((sum, file) => sum + file.additions, 0);
            const deletions = files.data.reduce((sum, file) => sum + file.deletions, 0);
            const total = additions + deletions;
            
            let sizeLabel = 'size/XS';
            if (total > 500) sizeLabel = 'size/L';
            else if (total > 100) sizeLabel = 'size/M';
            else if (total > 30) sizeLabel = 'size/S';
            
            try {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: [sizeLabel]
              });
            } catch (error) {
              console.log('Could not add label:', error.message);
            }

  validate-workflows:
    name: Validate Workflow Files
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate workflow YAML syntax
        run: |
          for workflow in .github/workflows/*.yml .github/workflows/*.yaml; do
            if [ -f "$workflow" ]; then
              echo "Validating $workflow"
              # Basic YAML validation
              python3 -c "import yaml; yaml.safe_load(open('$workflow'))" || exit 1
            fi
          done
          echo "✅ All workflow files have valid YAML syntax"
