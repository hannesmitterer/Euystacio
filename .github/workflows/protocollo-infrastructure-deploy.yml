name: Protocollo Meta Salvage - Infrastructure Deployment

on:
  push:
    branches:
      - main
    paths:
      - 'infrastructure/**'
      - 'terraform/**'
      - 'k8s/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      terraform-action:
        description: 'Terraform action'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply
          - destroy

permissions:
  contents: read
  pull-requests: write

jobs:
  terraform-plan:
    name: Terraform Plan - ${{ github.event.inputs.environment || 'staging' }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'staging' }}
    
    defaults:
      run:
        working-directory: ./infrastructure/terraform
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0
      
      - name: Create infrastructure directory structure
        run: |
          mkdir -p ../../infrastructure/terraform
          cd ../../infrastructure/terraform
          
          # Create main Terraform configuration if it doesn't exist
          if [ ! -f "main.tf" ]; then
            cat > main.tf << 'EOF'
          # Protocollo Meta Salvage Infrastructure Configuration
          
          terraform {
            required_version = ">= 1.0"
            required_providers {
              kubernetes = {
                source  = "hashicorp/kubernetes"
                version = "~> 2.23"
              }
            }
          }
          
          provider "kubernetes" {
            config_path = var.kubeconfig_path
          }
          
          # Variables
          variable "environment" {
            description = "Deployment environment"
            type        = string
            default     = "staging"
          }
          
          variable "kubeconfig_path" {
            description = "Path to kubeconfig file"
            type        = string
            default     = "~/.kube/config"
          }
          
          variable "namespace" {
            description = "Kubernetes namespace"
            type        = string
            default     = "protocollo-meta-salvage"
          }
          
          # Namespace for Protocollo Meta Salvage
          resource "kubernetes_namespace" "protocollo" {
            metadata {
              name = var.namespace
              labels = {
                environment = var.environment
                app         = "protocollo-meta-salvage"
              }
            }
          }
          
          # Outputs
          output "namespace_name" {
            value = kubernetes_namespace.protocollo.metadata[0].name
          }
          EOF
          fi
      
      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive || echo "Format check failed"
        continue-on-error: true
      
      - name: Terraform Init
        id: init
        run: |
          if [ -f "main.tf" ]; then
            terraform init
          else
            echo "No Terraform configuration found, skipping init"
            exit 0
          fi
      
      - name: Terraform Validate
        id: validate
        run: |
          if [ -f "main.tf" ]; then
            terraform validate -no-color
          fi
      
      - name: Terraform Plan
        id: plan
        if: github.event.inputs.terraform-action == 'plan' || github.event.inputs.terraform-action == ''
        run: |
          if [ -f "main.tf" ]; then
            terraform plan -no-color -var="environment=${{ github.event.inputs.environment || 'staging' }}"
          else
            echo "Terraform configuration placeholder - no actual infrastructure to plan"
          fi
        continue-on-error: true
      
      - name: Update PR with Terraform Plan
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request' && steps.plan.outcome != 'skipped'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const output = `#### Terraform Format and Style 🖌\`${{ steps.fmt.outcome }}\`
            #### Terraform Initialization ⚙️\`${{ steps.init.outcome }}\`
            #### Terraform Validation 🤖\`${{ steps.validate.outcome }}\`
            #### Terraform Plan 📖\`${{ steps.plan.outcome }}\`
            
            *Pusher: @${{ github.actor }}, Action: \`${{ github.event_name }}\`*`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

  terraform-apply:
    name: Terraform Apply - ${{ github.event.inputs.environment }}
    runs-on: ubuntu-latest
    needs: terraform-plan
    if: github.event.inputs.terraform-action == 'apply'
    environment: ${{ github.event.inputs.environment }}
    
    defaults:
      run:
        working-directory: ./infrastructure/terraform
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0
      
      - name: Terraform Init
        run: |
          if [ -f "main.tf" ]; then
            terraform init
          else
            echo "No Terraform configuration found"
            exit 0
          fi
      
      - name: Terraform Apply
        run: |
          if [ -f "main.tf" ]; then
            terraform apply -auto-approve -var="environment=${{ github.event.inputs.environment }}"
          else
            echo "Terraform configuration placeholder - no actual infrastructure to apply"
          fi

  kubernetes-deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: terraform-plan
    if: github.event.inputs.terraform-action != 'destroy'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Create Kubernetes manifests
        run: |
          mkdir -p k8s/protocollo
          
          # Create namespace manifest
          cat > k8s/protocollo/namespace.yaml << 'EOF'
          apiVersion: v1
          kind: Namespace
          metadata:
            name: protocollo-meta-salvage
            labels:
              app: protocollo-meta-salvage
              environment: staging
          EOF
          
          # Create Prometheus deployment manifest
          cat > k8s/protocollo/prometheus-deployment.yaml << 'EOF'
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: prometheus
            namespace: protocollo-meta-salvage
            labels:
              app: prometheus
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: prometheus
            template:
              metadata:
                labels:
                  app: prometheus
              spec:
                containers:
                - name: prometheus
                  image: prom/prometheus:latest
                  ports:
                  - containerPort: 9090
                    name: http
                  volumeMounts:
                  - name: config
                    mountPath: /etc/prometheus
                  resources:
                    requests:
                      memory: "512Mi"
                      cpu: "250m"
                    limits:
                      memory: "1Gi"
                      cpu: "500m"
                volumes:
                - name: config
                  configMap:
                    name: prometheus-config
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: prometheus
            namespace: protocollo-meta-salvage
          spec:
            selector:
              app: prometheus
            ports:
            - port: 9090
              targetPort: 9090
          EOF
          
          echo "Kubernetes manifests created"
      
      - name: Validate Kubernetes manifests
        run: |
          echo "Validating Kubernetes manifests..."
          if command -v kubectl &> /dev/null; then
            for file in k8s/protocollo/*.yaml; do
              kubectl --dry-run=client apply -f "$file" || echo "Validation failed for $file"
            done
          else
            echo "kubectl not available, skipping validation"
          fi
      
      - name: Upload Kubernetes manifests
        uses: actions/upload-artifact@v3
        with:
          name: kubernetes-manifests
          path: k8s/protocollo/
      
      - name: Deployment summary
        run: |
          echo "## Infrastructure Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Infrastructure configuration validated" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Components:" >> $GITHUB_STEP_SUMMARY
          echo "- Terraform configuration created" >> $GITHUB_STEP_SUMMARY
          echo "- Kubernetes manifests generated" >> $GITHUB_STEP_SUMMARY
          echo "- Namespace: protocollo-meta-salvage" >> $GITHUB_STEP_SUMMARY
