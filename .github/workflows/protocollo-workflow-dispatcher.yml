name: Protocollo Meta Salvage - Workflow Dispatcher

on:
  workflow_dispatch:
    inputs:
      workflow-type:
        description: 'Type of workflow to execute'
        required: true
        type: choice
        options:
          - full-pipeline
          - integration-only
          - e2e-only
          - deploy-only
          - monitoring-only
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

jobs:
  dispatcher:
    name: Workflow Dispatcher
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      run_integration: ${{ steps.determine.outputs.run_integration }}
      run_e2e: ${{ steps.determine.outputs.run_e2e }}
      run_deploy: ${{ steps.determine.outputs.run_deploy }}
      run_monitoring: ${{ steps.determine.outputs.run_monitoring }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Determine workflows to run
        id: determine
        run: |
          case "${{ github.event.inputs.workflow-type }}" in
            full-pipeline)
              echo "run_integration=true" >> $GITHUB_OUTPUT
              echo "run_e2e=true" >> $GITHUB_OUTPUT
              echo "run_deploy=true" >> $GITHUB_OUTPUT
              echo "run_monitoring=true" >> $GITHUB_OUTPUT
              ;;
            integration-only)
              echo "run_integration=true" >> $GITHUB_OUTPUT
              echo "run_e2e=false" >> $GITHUB_OUTPUT
              echo "run_deploy=false" >> $GITHUB_OUTPUT
              echo "run_monitoring=false" >> $GITHUB_OUTPUT
              ;;
            e2e-only)
              echo "run_integration=false" >> $GITHUB_OUTPUT
              echo "run_e2e=true" >> $GITHUB_OUTPUT
              echo "run_deploy=false" >> $GITHUB_OUTPUT
              echo "run_monitoring=false" >> $GITHUB_OUTPUT
              ;;
            deploy-only)
              echo "run_integration=false" >> $GITHUB_OUTPUT
              echo "run_e2e=false" >> $GITHUB_OUTPUT
              echo "run_deploy=true" >> $GITHUB_OUTPUT
              echo "run_monitoring=false" >> $GITHUB_OUTPUT
              ;;
            monitoring-only)
              echo "run_integration=false" >> $GITHUB_OUTPUT
              echo "run_e2e=false" >> $GITHUB_OUTPUT
              echo "run_deploy=false" >> $GITHUB_OUTPUT
              echo "run_monitoring=true" >> $GITHUB_OUTPUT
              ;;
          esac
      
      - name: Dispatch summary
        run: |
          echo "## Workflow Dispatch Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Workflow Type:** ${{ github.event.inputs.workflow-type }}" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ github.event.inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Workflows to Execute:" >> $GITHUB_STEP_SUMMARY
          echo "- Integration Testing: ${{ steps.determine.outputs.run_integration == 'true' && '✅' || '⏭️' }}" >> $GITHUB_STEP_SUMMARY
          echo "- E2E Testing: ${{ steps.determine.outputs.run_e2e == 'true' && '✅' || '⏭️' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Infrastructure Deployment: ${{ steps.determine.outputs.run_deploy == 'true' && '✅' || '⏭️' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Monitoring Deployment: ${{ steps.determine.outputs.run_monitoring == 'true' && '✅' || '⏭️' }}" >> $GITHUB_STEP_SUMMARY
  
  integration-test:
    name: Run Integration Tests
    needs: dispatcher
    if: needs.dispatcher.outputs.run_integration == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/protocollo-integration-test.yml
  
  e2e-test:
    name: Run E2E Tests
    needs: [dispatcher, integration-test]
    if: |
      always() &&
      needs.dispatcher.outputs.run_e2e == 'true' &&
      (needs.integration-test.result == 'success' || needs.integration-test.result == 'skipped')
    permissions:
      contents: read
    uses: ./.github/workflows/protocollo-e2e-test.yml
  
  deploy-infrastructure:
    name: Deploy Infrastructure
    needs: [dispatcher, integration-test, e2e-test]
    if: |
      always() &&
      needs.dispatcher.outputs.run_deploy == 'true' &&
      (needs.integration-test.result == 'success' || needs.integration-test.result == 'skipped') &&
      (needs.e2e-test.result == 'success' || needs.e2e-test.result == 'skipped')
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/protocollo-infrastructure-deploy.yml
    with:
      environment: ${{ github.event.inputs.environment }}
      terraform-action: 'plan'
  
  deploy-monitoring:
    name: Deploy Monitoring
    needs: [dispatcher, deploy-infrastructure]
    if: |
      always() &&
      needs.dispatcher.outputs.run_monitoring == 'true' &&
      (needs.deploy-infrastructure.result == 'success' || needs.deploy-infrastructure.result == 'skipped')
    permissions:
      contents: read
    uses: ./.github/workflows/protocollo-monitoring-deploy.yml
    with:
      deploy-prometheus: true
      deploy-grafana: true
  
  final-summary:
    name: Pipeline Summary
    runs-on: ubuntu-latest
    needs: [dispatcher, integration-test, e2e-test, deploy-infrastructure, deploy-monitoring]
    if: always()
    permissions:
      contents: read
    
    steps:
      - name: Generate final summary
        run: |
          echo "# Protocollo Meta Salvage - Pipeline Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Workflow Type:** ${{ github.event.inputs.workflow-type }}" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ github.event.inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Execution Results:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Integration Test Result
          if [ "${{ needs.integration-test.result }}" = "success" ]; then
            echo "- ✅ Integration Testing: **Success**" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.integration-test.result }}" = "failure" ]; then
            echo "- ❌ Integration Testing: **Failed**" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.integration-test.result }}" = "skipped" ]; then
            echo "- ⏭️ Integration Testing: **Skipped**" >> $GITHUB_STEP_SUMMARY
          fi
          
          # E2E Test Result
          if [ "${{ needs.e2e-test.result }}" = "success" ]; then
            echo "- ✅ E2E Testing: **Success**" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.e2e-test.result }}" = "failure" ]; then
            echo "- ❌ E2E Testing: **Failed**" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.e2e-test.result }}" = "skipped" ]; then
            echo "- ⏭️ E2E Testing: **Skipped**" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Infrastructure Deployment Result
          if [ "${{ needs.deploy-infrastructure.result }}" = "success" ]; then
            echo "- ✅ Infrastructure Deployment: **Success**" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.deploy-infrastructure.result }}" = "failure" ]; then
            echo "- ❌ Infrastructure Deployment: **Failed**" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.deploy-infrastructure.result }}" = "skipped" ]; then
            echo "- ⏭️ Infrastructure Deployment: **Skipped**" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Monitoring Deployment Result
          if [ "${{ needs.deploy-monitoring.result }}" = "success" ]; then
            echo "- ✅ Monitoring Deployment: **Success**" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.deploy-monitoring.result }}" = "failure" ]; then
            echo "- ❌ Monitoring Deployment: **Failed**" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.deploy-monitoring.result }}" = "skipped" ]; then
            echo "- ⏭️ Monitoring Deployment: **Skipped**" >> $GITHUB_STEP_SUMMARY
          fi
