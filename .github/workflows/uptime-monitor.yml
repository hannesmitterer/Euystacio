name: Uptime Monitor

on:
  schedule:
    # Run every 30 minutes
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  monitor:
    name: Monitor GitHub Pages
    runs-on: ubuntu-latest
    
    steps:
      - name: Check GitHub Pages availability
        run: |
          SITE_URL="https://hannesmitterer.github.io/Euystacio/"
          
          echo "Checking $SITE_URL..."
          
          # Check if site is accessible
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$SITE_URL")
          
          echo "HTTP Status: $HTTP_STATUS"
          
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "✓ Site is accessible"
          else
            echo "✗ Site returned status $HTTP_STATUS"
            exit 1
          fi
          
          # Check response time
          RESPONSE_TIME=$(curl -o /dev/null -s -w '%{time_total}\n' "$SITE_URL")
          echo "Response time: ${RESPONSE_TIME}s"
          
          # Alert if response time is too slow (> 3 seconds)
          # Using awk for portable arithmetic comparison
          if awk "BEGIN {exit !($RESPONSE_TIME > 3.0)}"; then
            echo "⚠ Warning: Site is slow (${RESPONSE_TIME}s)"
          fi
      
      - name: Create monitoring report
        if: always()
        run: |
          cat > monitoring-report.txt << EOF
          Uptime Monitoring Report
          ========================
          Date: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          Site: https://hannesmitterer.github.io/Euystacio/
          Status: ${{ job.status }}
          
          This is an automated uptime check for the GitHub Pages deployment.
          EOF
          
          cat monitoring-report.txt
      
      - name: Upload monitoring report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monitoring-report-${{ github.run_number }}
          path: monitoring-report.txt
          retention-days: 30

  notify-on-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: monitor
    if: failure()
    
    steps:
      - name: Create issue on failure
        uses: actions/github-script@v7
        with:
          script: |
            const title = '🚨 GitHub Pages Uptime Alert';
            const body = `
            The GitHub Pages site appears to be down or experiencing issues.
            
            **Details:**
            - Run ID: ${context.runId}
            - Timestamp: ${new Date().toISOString()}
            - URL: https://hannesmitterer.github.io/Euystacio/
            
            Please investigate and resolve the issue.
            
            _This issue was automatically created by the uptime monitor workflow._
            `;
            
            // Check if there's already an open issue
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'uptime-alert'
            });
            
            if (issues.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['uptime-alert', 'bug']
              });
            } else {
              // Add a comment to existing issue
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues.data[0].number,
                body: `Another uptime check failed at ${new Date().toISOString()}`
              });
            }
