name: Workflow Monitoring

on:
  workflow_run:
    workflows: ["CI/CD Pipeline", "CodeQL Security Scan", "Deploy to GitHub Pages"]
    types:
      - completed
  schedule:
    # Run daily at 9:00 UTC
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  monitor-workflows:
    name: Monitor Workflow Health
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Analyze workflow results
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            
            // Get recent workflow runs
            const { data: runs } = await github.rest.actions.listWorkflowRunsForRepo({
              owner,
              repo,
              per_page: 50,
              status: 'completed'
            });
            
            // Calculate statistics
            const stats = {
              total: runs.workflow_runs.length,
              success: runs.workflow_runs.filter(r => r.conclusion === 'success').length,
              failure: runs.workflow_runs.filter(r => r.conclusion === 'failure').length,
              cancelled: runs.workflow_runs.filter(r => r.conclusion === 'cancelled').length
            };
            
            const successRate = ((stats.success / stats.total) * 100).toFixed(2);
            
            console.log('=== Workflow Health Report ===');
            console.log(`Total runs: ${stats.total}`);
            console.log(`Successful: ${stats.success}`);
            console.log(`Failed: ${stats.failure}`);
            console.log(`Cancelled: ${stats.cancelled}`);
            console.log(`Success rate: ${successRate}%`);
            
            // Create summary
            await core.summary
              .addHeading('Workflow Health Report')
              .addTable([
                [{data: 'Metric', header: true}, {data: 'Value', header: true}],
                ['Total Runs', stats.total.toString()],
                ['Successful', stats.success.toString()],
                ['Failed', stats.failure.toString()],
                ['Cancelled', stats.cancelled.toString()],
                ['Success Rate', `${successRate}%`]
              ])
              .write();
            
            // Fail if success rate is below threshold
            if (parseFloat(successRate) < 80 && stats.total > 10) {
              core.setFailed(`Success rate ${successRate}% is below 80% threshold`);
            }

      - name: Check for failed workflows
        uses: actions/github-script@v7
        with:
          script: |
            const { data: runs } = await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 10,
              status: 'completed',
              conclusion: 'failure'
            });
            
            if (runs.workflow_runs.length > 0) {
              console.log('⚠️ Recent failed workflows:');
              runs.workflow_runs.forEach(run => {
                console.log(`- ${run.name}: ${run.html_url}`);
              });
            } else {
              console.log('✅ No recent workflow failures');
            }

  report-slow-workflows:
    name: Report Slow Workflows
    runs-on: ubuntu-latest
    permissions:
      actions: read
    
    steps:
      - name: Find slow workflows
        uses: actions/github-script@v7
        with:
          script: |
            const { data: runs } = await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 20,
              status: 'completed'
            });
            
            const slowThresholdMinutes = 10;
            const slowRuns = runs.workflow_runs.filter(run => {
              const duration = (new Date(run.updated_at) - new Date(run.created_at)) / 1000 / 60;
              return duration > slowThresholdMinutes;
            });
            
            if (slowRuns.length > 0) {
              console.log(`⚠️ Found ${slowRuns.length} workflows taking more than ${slowThresholdMinutes} minutes:`);
              slowRuns.forEach(run => {
                const duration = ((new Date(run.updated_at) - new Date(run.created_at)) / 1000 / 60).toFixed(2);
                console.log(`- ${run.name}: ${duration} minutes`);
              });
            } else {
              console.log(`✅ All workflows completed within ${slowThresholdMinutes} minutes`);
            }
