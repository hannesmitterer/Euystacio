version: "3.8"
services:
  flask:
    build: .
    command: gunicorn app:app -b 0.0.0.0:5000
    ports:
      - "5000:5000"
    volumes:
      - .:/app
  fastapi:
    build: .
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - .:/app
  nginx:
    image: nginx:stable
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./public:/usr/share/nginx/html:ro
    depends_on:
      - flask
      - fastapi
