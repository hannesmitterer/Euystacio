global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'euystacio'
    replica: '0'

# Alerting configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets: []

# Load rules
rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

# Scrape configurations
scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Euystacio nodes
  - job_name: 'euystacio-nodes'
    static_configs:
      - targets: ['localhost:8080']
        labels:
          node: 'main'
          instance: 'euystacio-primary'

  # Loki metrics
  - job_name: 'loki'
    static_configs:
      - targets: ['loki:3100']

  # Grafana metrics
  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']
