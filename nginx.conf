# Example nginx config to route:
# - /api/flask/* -> Flask app (port 5000)
# - /api/fastapi/* -> FastAPI app (port 8000)
events {}
http {
  server {
    listen 80;
    server_name _;

    location /api/flask/ {
      proxy_pass http://flask:5000/;
      proxy_set_header Host $host;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
    }

    location /api/fastapi/ {
      proxy_pass http://fastapi:8000/;
      proxy_set_header Host $host;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
    }

    # static: serve from Netlify or local public/
    location / {
      root /usr/share/nginx/html;
      index index.html;
    }
  }
}
