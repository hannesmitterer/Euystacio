<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PBL-001: Euystacio Sacred Interface</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
        }
        h1 {
            text-align: center;
            margin-bottom: 10px;
            font-size: 2.5em;
        }
        h2 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 1.2em;
            opacity: 0.9;
        }
        .sign-in-section {
            text-align: center;
            margin: 30px 0;
        }
        .controls {
            margin-top: 30px;
            display: none;
        }
        .controls.active {
            display: block;
        }
        .control-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            padding: 15px 30px;
            margin: 10px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s;
        }
        .control-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }
        .control-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .user-info {
            background: rgba(255, 255, 255, 0.15);
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            text-align: center;
        }
        .status-message {
            margin: 15px 0;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }
        .status-success {
            background: rgba(16, 185, 129, 0.3);
            border: 2px solid rgba(16, 185, 129, 0.5);
        }
        .status-error {
            background: rgba(239, 68, 68, 0.3);
            border: 2px solid rgba(239, 68, 68, 0.5);
        }
        .status-info {
            background: rgba(59, 130, 246, 0.3);
            border: 2px solid rgba(59, 130, 246, 0.5);
        }
        .g_id_signin {
            margin: 20px auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌟 PBL-001</h1>
        <h2>Euystacio Sacred Interface</h2>
        
        <div class="sign-in-section" id="signInSection">
            <p>Please sign in with your Google account to access the interface.</p>
            <div id="g_id_onload"
                 data-client_id="YOUR_GOOGLE_CLIENT_ID"
                 data-callback="handleCredentialResponse">
            </div>
            <div class="g_id_signin" 
                 data-type="standard"
                 data-size="large"
                 data-theme="filled_blue"
                 data-text="sign_in_with"
                 data-shape="rectangular"
                 data-logo_alignment="left">
            </div>
        </div>

        <div class="user-info" id="userInfo" style="display: none;">
            <strong>Signed in as:</strong> <span id="userEmail"></span>
        </div>

        <div id="statusMessages"></div>

        <div class="controls" id="controls">
            <h3 style="text-align: center;">Sacred Controls</h3>
            <div style="text-align: center;">
                <button class="control-btn" onclick="accessSFI()">Access SFI (Council)</button>
                <button class="control-btn" onclick="accessMCLLive()">Access MCL Live (Council)</button>
                <button class="control-btn" onclick="submitAllocations()">Submit Allocations (Seedbringer)</button>
            </div>
        </div>
    </div>

    <script>
        let idToken = null;

        function handleCredentialResponse(response) {
            idToken = response.credential;
            
            // Decode JWT to get user info (basic decoding, not verification)
            const base64Url = idToken.split('.')[1];
            const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            const jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
            
            const payload = JSON.parse(jsonPayload);
            
            // Update UI
            document.getElementById('userEmail').textContent = payload.email;
            document.getElementById('userInfo').style.display = 'block';
            document.getElementById('signInSection').style.display = 'none';
            document.getElementById('controls').classList.add('active');
            
            showStatus('Successfully signed in!', 'success');
        }

        function showStatus(message, type) {
            const statusDiv = document.getElementById('statusMessages');
            const statusEl = document.createElement('div');
            statusEl.className = `status-message status-${type}`;
            statusEl.textContent = message;
            statusDiv.appendChild(statusEl);
            
            setTimeout(() => {
                statusEl.remove();
            }, 5000);
        }

        async function makeAuthenticatedRequest(url, method = 'GET', body = null) {
            if (!idToken) {
                showStatus('Please sign in first', 'error');
                return;
            }

            try {
                const options = {
                    method: method,
                    headers: {
                        'Authorization': `Bearer ${idToken}`,
                        'Content-Type': 'application/json'
                    }
                };

                if (body) {
                    options.body = JSON.stringify(body);
                }

                const response = await fetch(url, options);
                const data = await response.json();

                if (response.ok) {
                    showStatus(`Success: ${data.message}`, 'success');
                } else {
                    showStatus(`Error: ${data.error}`, 'error');
                }
            } catch (error) {
                showStatus(`Network error: ${error.message}`, 'error');
            }
        }

        function accessSFI() {
            makeAuthenticatedRequest('/sfi');
        }

        function accessMCLLive() {
            makeAuthenticatedRequest('/mcl/live');
        }

        function submitAllocations() {
            const sampleData = {
                allocation: 'sacred-resource',
                amount: 100,
                timestamp: new Date().toISOString()
            };
            makeAuthenticatedRequest('/allocations', 'POST', sampleData);
        }
    </script>
</body>
</html>
