<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Kosymbiosis Dashboard - Euystacio Agent</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7f6; color: #2c3e50; }
        .card { border-radius: 15px; border: none; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .reflection-block { background: #fff; border-left: 5px solid #27ae60; }
    </style>
</head>
<body class="py-5">
    <div class="container">
        <header class="text-center mb-5">
            <h1 class="display-4">🌿 Kosymbiosis Dashboard</h1>
            <p class="lead">Lex Amoris Framework — Integrazione Agente Euystacio</p>
        </header>

        <div class="card p-4 mb-5">
            <form action="/reflect" method="post">
                <label class="form-label fw-bold">Inserisci una situazione da analizzare:</label>
                <textarea name="situation" class="form-control mb-3" rows="3" placeholder="Es: Devo decidere come gestire i dati del micelio..."></textarea>
                <button type="submit" class="btn btn-success w-100">Genera Riflessione Etica</button>
            </form>
        </div>

        <h3 class="mb-4">Storico delle Riflessioni</h3>
        {% for r in reflections[::-1] %}
        <div class="card p-3 mb-3 reflection-block">
            <small class="text-muted">{{ r.timestamp }}</small>
            <h5 class="mt-2 text-primary">Situazione: {{ r.situation }}</h5>
            <pre class="bg-light p-2 mt-2" style="white-space: pre-wrap;">{{ r.reflection }}</pre>
        </div>
        {% endfor %}
    </div>
</body>
</html>
